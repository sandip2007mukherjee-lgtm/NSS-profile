<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NSS Poster Studio Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div>
    <h1>NSS Poster Studio <span>PRO</span></h1>
    <p>Original A4-style NSS group poster maker • 1–10 members</p>
  </div>
  <div class="top-actions">
    <button onclick="downloadPoster('png')">PNG</button>
    <button onclick="downloadPoster('jpg')">JPG</button>
    <button onclick="downloadPDF()">PDF</button>
    <button class="primary" onclick="saveDraft()">Save</button>
    <button onclick="loadDraft()">Load</button>
    <button class="danger" onclick="resetAll()">Reset</button>
  </div>
</header>

<main class="app">
  <aside class="panel">
    <section class="section">
      <h2>1. Poster setup</h2>
      <label>Group name<input id="groupName" value="APJ ABDUL KALAM"></label>
      <div class="two">
        <label>Members<select id="memberCount"></select></label>
        <label>Quality<select id="quality"><option value="2">2× HD</option><option value="3">3× Ultra</option><option value="1">1× Fast</option></select></label>
      </div>
      <label>Main title<input id="mainTitle" value="APJ ABDUL KALAM"></label>
      <label>Subtitle<input id="subtitle" value="NSS GROUP LEADER"></label>
      <label>Quote<textarea id="quote">Dream is not what you see in sleep, Dream is something that does not let you sleep.</textarea></label>
      <label>Quote author<input id="quoteAuthor" value="APJ ABDUL KALAM"></label>
      <label>Footer<input id="footer" value="NOT ME BUT YOU"></label>
    </section>

    <section class="section">
      <h2>2. Photos & logos</h2>
      <label>Monishir / header photo<input type="file" accept="image/*" id="apjPhoto"></label>
      <label>Left NSS logo<input type="file" accept="image/*" id="leftLogo"></label>
      <label>Right NSS logo<input type="file" accept="image/*" id="rightLogo"></label>
    </section>

    <section class="section">
      <h2>3. Group leader</h2>
      <label>Name<input id="leaderName" value="YOUR NAME"></label>
      <div class="two">
        <label>Mobile<input id="leaderMobile" value=""></label>
        <label>Semester<input id="leaderSemester" value="5TH SEM"></label>
      </div>
      <label>Subject<input id="leaderSubject" value="GEOGRAPHY HONOURS"></label>
      <label>Photo<input type="file" accept="image/*" id="leaderPhoto"></label>
    </section>

    <section class="section">
      <div class="row-between"><h2>4. Members</h2><button onclick="clearMemberData()">Clear</button></div>
      <div id="memberFields"></div>
    </section>
  </aside>

  <section class="preview-area">
    <div class="preview-head">
      <strong>Live A4 preview</strong>
      <span id="sizeLabel">1087 × 1536</span>
    </div>
    <div class="paper-wrap"><canvas id="poster"></canvas></div>
    <p class="hint">Tip: choose the member count first. The poster automatically creates exactly that many member spaces.</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
